<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Gasparina</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Si el código de la app ni siquiera arranca (celular viejo, descarga fallida), lo decimos en vez de dejar la pantalla negra. -->
    <script>
      window.__cerebroErrors = [];
      window.addEventListener('error', function (e) { window.__cerebroErrors.push(String(e.message || e)); });
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.firstChild) {
          r.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;background:#0A0A0C;color:#fff;font-family:system-ui,sans-serif">'
            + '<p style="margin:0;font-size:24px;font-weight:800">No pudimos abrir Gasparina<span style="color:#EB0C6E">.</span></p>'
            + '<p style="margin:0;font-size:15px;color:#B4B4BE">Revisa tu conexión y vuelve a abrir la app.</p>'
            + '<p style="margin:0;font-size:12px;color:#8A8A96;word-break:break-word">' + window.__cerebroErrors.join(' · ').replace(/</g, '&lt;') + '</p></div>';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
